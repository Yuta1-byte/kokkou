<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>刻光 KOKKŌ — HD-2D Rebuild Alpha</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
html,body{height:100%;width:100%;overflow:hidden;background:#05060c;
  font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif;}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);}
#stage{flex:1 1 auto;display:flex;align-items:center;justify-content:center;min-height:0;position:relative;}
#game{display:block;touch-action:none;background:#05060c;
  box-shadow:0 0 0 1px #2a2f45, 0 0 42px rgba(155,111,214,.18);}
#pad{flex:0 0 auto;height:158px;display:flex;align-items:center;justify-content:space-between;
  padding:6px 16px 10px;}
@media (min-height:860px){#pad{height:190px;}}
.dpad{position:relative;width:132px;height:132px;flex:0 0 auto;}
.dpad button{position:absolute;width:44px;height:44px;border:0;background:rgba(232,228,216,.07);
  border:1px solid rgba(232,228,216,.16);color:#cfd6e6;font-size:15px;line-height:1;border-radius:9px;}
.dpad button:active{background:rgba(255,207,107,.28);border-color:#ffcf6b;}
.dpad .u{left:44px;top:0}.dpad .d{left:44px;top:88px}.dpad .l{left:0;top:44px}.dpad .r{left:88px;top:44px}
.dpad .c{left:44px;top:44px;background:rgba(232,228,216,.03);border-color:rgba(232,228,216,.08);pointer-events:none}
.acts{display:flex;flex-direction:column;align-items:flex-end;gap:9px;}
.row2{display:flex;gap:12px;align-items:center;}
.acts button{border:1px solid rgba(232,228,216,.18);background:rgba(232,228,216,.06);color:#e8e4d8;
  border-radius:999px;font-size:12px;letter-spacing:.08em;}
.big{width:62px;height:62px;font-size:13px;line-height:1.25;}
#bA{border-color:rgba(255,207,107,.55);color:#ffcf6b;background:rgba(255,207,107,.10);}
#bB{border-color:rgba(111,214,232,.4);color:#9fd8e4;}
.small{height:30px;padding:0 14px;}
.acts button:active{background:rgba(255,207,107,.3);}
#hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;color:#4d5570;font-size:10px;letter-spacing:.14em;}
</style>
</head>
<body>
<div id="wrap">
  <div id="stage"><canvas id="game"></canvas><div id="hint">↑↓←→ 移動 ／ Z 決定 ／ X もどる・長押しでダッシュ ／ Shift メニュー</div></div>
  <div id="pad">
    <div class="dpad">
      <button class="u" data-k="up">▲</button><button class="l" data-k="left">◀</button>
      <button class="c"></button>
      <button class="r" data-k="right">▶</button><button class="d" data-k="down">▼</button>
    </div>
    <div class="acts">
      <div class="row2">
        <button class="small" id="bM" data-k="m">メニュー</button>
        <button class="small" id="bS" data-k="s">♪</button>
      </div>
      <div class="row2">
        <button class="big" id="bB" data-k="b">もどる<br><span style="font-size:9px;opacity:.65">長押し走</span></button>
        <button class="big" id="bA" data-k="a">けってい</button>
      </div>
    </div>
  </div>
</div>

const ART={};
Object.entries(ASSET_DATA).forEach(([k,v])=>{const im=new Image();im.src=v;ART[k]=im;});
function artReady(k){return ART[k]&&ART[k].complete&&ART[k].naturalWidth>0;}
function drawArt(k,x,y,w,h,alpha=1,sx=0,sy=0,sw=null,sh=null){
  if(!artReady(k))return false; const im=ART[k];
  CX.save();CX.globalAlpha=alpha;
  if(sw==null)CX.drawImage(im,x,y,w,h); else CX.drawImage(im,sx,sy,sw,sh,x,y,w,h);
  CX.restore();return true;
}

let G=null;
function newGame(){
  return {
    map:'aoi', px:5, py:6, dir:'u',
    party:[mkChar('ren')], bag:{kusa:3,tsuyu:1}, lore:{}, recs:{},
    flags:{}, chests:{}, steps:0, playtime:0
  };
}
function expFloorForLevel(lv){return lv<=1?0:nextExp(lv-1);}
function normalizeCharGrowth(c){
  // 旧セーブや後加入キャラで「レベルだけ高く、累積経験値が不足」する状態を補正
  c.exp=Math.max(Number(c.exp)||0,expFloorForLevel(c.lv));
  c.alive=c.hp>0;
  return c;
}
function joinParty(id){
  if(G.party.some(c=>c.id===id))return;
  const c=mkChar(id), lead=normalizeCharGrowth(G.party[0]);
  while(c.lv<lead.lv) levelUpChar(c,true);
  // 本作の経験値は累積式。レベルだけ同期すると次の成長が極端に遅れるため進捗も同期する
  c.exp=Math.max(expFloorForLevel(c.lv),lead.exp);
  c.hp=c.mhp; c.mp=c.mmp;
  G.party.push(c);
}
function hasTech(c,k){const t=TECHS[k];return t.by===c.id&&c.lv>=t.lv;}
function charTechs(c){return Object.keys(TECHS).filter(k=>hasTech(c,k));}

const CV=document.getElementById('game'), CX=CV.getContext('2d');
let SC=1;
function resize(){
  const st=document.getElementById('stage'), r=st.getBoundingClientRect();
  const s=Math.max(.5,Math.min(r.width/LW,(r.height-14)/LH));
  const dpr=Math.min(window.devicePixelRatio||1,3);
  CV.style.width=(LW*s)+'px'; CV.style.height=(LH*s)+'px';
  CV.width=Math.round(LW*s*dpr); CV.height=Math.round(LH*s*dpr);
  SC=s*dpr;
}
addEventListener('resize',resize); addEventListener('orientationchange',()=>setTimeout(resize,120));

const K={up:0,down:0,left:0,right:0,b:0};
let pressA=false,pressB=false,pressM=false,pressAny=false;
const KEYMAP={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',
 w:'up',s:'down',a:'left',d:'right',W:'up',S:'down',A:'left',D:'right'};
addEventListener('keydown',e=>{
  if(KEYMAP[e.key]){K[KEYMAP[e.key]]=1;e.preventDefault();}
  if(e.key==='z'||e.key==='Z'||e.key==='Enter'||e.key===' '){pressA=true;e.preventDefault();}
  if(e.key==='x'||e.key==='X'||e.key==='Escape'){pressB=true;K.b=1;}
  if(e.key==='Shift'){pressM=true;}
  pressAny=true; audioKick();
});
addEventListener('keyup',e=>{ if(KEYMAP[e.key])K[KEYMAP[e.key]]=0;
  if(e.key==='x'||e.key==='X'||e.key==='Escape')K.b=0; });
document.querySelectorAll('[data-k]').forEach(b=>{
  const k=b.dataset.k;
  const on=e=>{e.preventDefault();audioKick();pressAny=true;
    if(k==='a')pressA=true; else if(k==='b'){pressB=true;K.b=1;} else if(k==='m')pressM=true;
    else if(k==='s')toggleSound(); else K[k]=1;};
  const off=e=>{e.preventDefault(); if(K[k]!==undefined)K[k]=0;};
  b.addEventListener('touchstart',on,{passive:false});
  b.addEventListener('touchend',off,{passive:false});
  b.addEventListener('touchcancel',off,{passive:false});
  b.addEventListener('mousedown',on); b.addEventListener('mouseup',off);
  b.addEventListener('mouseleave',off);
});
function eatInput(){pressA=false;pressB=false;pressM=false;pressAny=false;}

/* ============================================================
   音
   ============================================================ */
let AC=null,MG=null,soundOn=true,bgmTimer=0,bgmStep=0,curBgm='field';
function audioKick(){
  if(AC)  { if(AC.state==='suspended')AC.resume(); return; }
  try{ AC=new (window.AudioContext||window.webkitAudioContext)();
    MG=AC.createGain(); MG.gain.value=.5; MG.connect(AC.destination);
  }catch(e){AC=null;}
}
function toggleSound(){ soundOn=!soundOn; if(MG)MG.gain.value=soundOn?.5:0;
  document.getElementById('bS').style.opacity=soundOn?1:.35; }
function tone(f,d,type,vol,when){
  if(!AC||!soundOn)return;
  const t=(when||0)+AC.currentTime;
  const o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol||.12,t+.01);
  g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g); g.connect(MG); o.start(t); o.stop(t+d+.02);
}

const BGM={
  field:{bpm:104,bass:[0,0,-5,-5,-3,-3,-7,-7],arp:[0,4,7,11,7,4,0,4],root:220,wave:'triangle'},
  future:{bpm:88,bass:[0,0,-2,-2,-5,-5,-4,-4],arp:[0,3,7,10,7,3,0,3],root:196,wave:'sine'},
  past:{bpm:96,bass:[0,0,-4,-4,-7,-7,-5,-5],arp:[0,4,9,12,9,4,0,4],root:233,wave:'triangle'},
  battle:{bpm:150,bass:[0,0,0,-2,-3,-3,-5,-5],arp:[0,3,7,12,10,7,3,0],root:262,wave:'square'},
  boss:{bpm:164,bass:[0,-1,0,-1,-3,-4,-3,-4],arp:[0,3,6,11,6,3,0,-1],root:247,wave:'sawtooth'},
  none:null
};
function setBgm(k){ if(curBgm!==k){curBgm=k; bgmStep=0; bgmTimer=0;} }
function bgmTick(dt){
  const b=BGM[curBgm]; if(!b||!AC||!soundOn)return;
  bgmTimer-=dt; if(bgmTimer>0)return;
  const spb=60/b.bpm/2; bgmTimer+=spb;
  const i=bgmStep%8;
  const semi=n=>b.root*Math.pow(2,n/12);
  tone(semi(b.bass[i])/2,spb*1.6,'sine',.09);
  tone(semi(b.arp[i])*2,spb*.85,b.wave,.035);
  if(i%4===0)tone(semi(b.arp[i]),spb*1.1,'triangle',.03);
  bgmStep++;
}
function mapBgm(){

function drawAmbient(kind){
  for(let i=0;i<26;i++){
    const x=(i*71+T*(kind==='rain'?52:8))%340-10;
    const y=(i*43+T*(kind==='rain'?96:14))%260-10;
    if(kind==='rain'){CX.strokeStyle='rgba(150,190,230,.20)';CX.beginPath();CX.moveTo(x,y);CX.lineTo(x-3,y+8);CX.stroke();}
    else {CX.globalAlpha=.12+(i%4)*.04;rect(x,y,1+(i%2),1+(i%2),i%3?C.hi:C.time);CX.globalAlpha=1;}
  }
}
function wrap(s,w,sz){
  font(sz||11); const out=[]; let line='';
  for(const ch of s){
    if(ch==='\n'){out.push(line);line='';continue;}
    if(CX.measureText(line+ch).width>w){out.push(line);line=ch;}
    else line+=ch;
  }
  if(line)out.push(line); return out;
}

}

let scene='title';
let mv=null;            // {fx,fy,tx,ty,t}
let trail=[];
let dlg=null;           // {lines,i,after,onEnd}
let toastMsg=null,toastT=0;
let fade=0,fadeDir=0,fadeCb=null;
let encCount=0, shake=0;

function toast(s){toastMsg=s;toastT=2.2;}
function resetRuntime(){ trail=[];dlg=null;gateMenu=null;menu=null;B=null;mv=null;ending=null;
  fade=0;fadeDir=0;fadeCb=null;encCount=0;shake=0; }
function fadeTo(cb){fadeDir=1;fadeCb=cb;}
function say(lines,after){ dlg={lines:lines.slice(),i:0,ch:0,after:after||null}; }

function tileAt(m,x,y){
  const t=MAPS[m].tiles;
  if(y<0||y>=t.length)return '#';
  const row=t[y]; if(x<0||x>=row.length)return '#';
  return row[x];
}
function npcAt(x,y){
  const l=NPCS[G.map]||[]; return l.find(n=>n.x===x&&n.y===y&&!(n.hide&&n.hide(G)));
}
function chestAt(x,y){
  return CHESTS.find(c=>c.m===G.map&&c.x===x&&c.y===y&&!G.chests[c.id]);
}
function walkable(x,y){
  if(BLOCK.has(tileAt(G.map,x,y)))return false;
  if(npcAt(x,y))return false;
  if(chestAt(x,y))return false;
  return true;
}

function tryMove(dx,dy){
  const nx=G.px+dx, ny=G.py+dy;
  G.dir = dy>0?'d':dy<0?'u':dx<0?'l':'r';
  if(!walkable(nx,ny))return;
  trail.unshift({x:G.px,y:G.py,d:G.dir});
  if(trail.length>10)trail.pop();
  mv={fx:G.px,fy:G.py,tx:nx,ty:ny,t:0};
  G.px=nx; G.py=ny;
}
function onArrive(){
  G.steps++;
  const w=(WARPS[G.map]||[]).find(v=>v.x===G.px&&v.y===G.py);
  if(w){ fadeTo(()=>{ G.map=w.m; G.px=w.tx; G.py=w.ty; trail=[]; setBgm(mapBgm()); mapEnter(); }); return; }
  if(tileAt(G.map,G.px,G.py)==='G'){ openGate(); return; }
  const b=BOSSPTS.find(b=>b.m===G.map&&b.x===G.px&&b.y===G.py&&!G.flags[b.flag]);
  if(b){ SE.enc(); say(b.pre,()=>startBattle([b.id],b)); return; }
  const e=MAPS[G.map].enc;
  if(e){
    encCount++;
    if(encCount>3 && Math.random()<e.rate){
      encCount=0; SE.enc(); shake=.4;
      const n=1+(Math.random()<.55?1:0)+(Math.random()<.25?1:0);
      const foes=[]; for(let i=0;i<n;i++)foes.push(e.list[Math.floor(Math.random()*e.list.length)]);
      fadeTo(()=>startBattle(foes,null));
    }
  }
}
function interact(){
  const d=G.dir, dx=d==='l'?-1:d==='r'?1:0, dy=d==='u'?-1:d==='d'?1:0;
  const tx=G.px+dx, ty=G.py+dy;
  const n=npcAt(tx,ty);
  if(n){ SE.ok(); n.dir=d==='l'?'r':d==='r'?'l':d==='u'?'d':'u';
    say(n.talk(G), n.after?()=>n.after(G):null); return; }
  const c=chestAt(tx,ty);
  if(c){ SE.win(); G.chests[c.id]=1; G.bag[c.it]=(G.bag[c.it]||0)+c.n;
    say([{sp:'',t:'宝箱をあけた。'+iInfo(c.it).n+(c.n>1?' ×'+c.n:'')+' を手に入れた！'+(EQUIP[c.it]?'（メニューの「そうび」から装備できる）':'')}]); return; }
  if(tileAt(G.map,tx,ty)==='d'){ SE.no(); say([{sp:'',t:DOORLINE[G.map]||'扉は開かない。'}]); return; }
  if(tileAt(G.map,G.px,G.py)==='G'||tileAt(G.map,tx,ty)==='G'){ openGate(); return; }
}
function openGate(){
  const list=(GATES[G.map]||[]).filter(g=>!g.req||G.flags[g.req]);
  if(!list.length){ say([{sp:'',t:'扉は静かに脈打っている。まだ、渡る先がない。'}]); return; }
  SE.gate();
  G.party.forEach(c=>{c.hp=c.mhp;c.mp=c.mmp;c.alive=true;});
  saveGame().then(()=>{hasSave=true;});
  toast('灯が満ちた ― 全員回復・記録');
  gateMenu={list,sel:0};
}
let gateMenu=null;

function updateField(dt){
  if(dlg){
    const cur=dlg.lines[dlg.i], full=cur?cur.t.length:0;
    if(dlg.ch<full)dlg.ch=Math.min(full,dlg.ch+dt*46);
    if(pressA||pressB){
      SE.cur();
      if(dlg.ch<full){ dlg.ch=full; }
      else { dlg.i++; dlg.ch=0;

function mkNav(){let last=0,t=0;return function(a,b,dt){
  let d=0; if(K[a])d=-1; else if(K[b])d=1;
  if(!d){last=0;t=0;return 0;}
  if(last!==d){last=d;t=.3;return d;}
  t-=dt; if(t<=0){t=.1;return d;} return 0;};}
const navY=mkNav(), navX=mkNav(), navY2=mkNav();

/* ============================================================
   成長
   ============================================================ */
const GROW={ren:{hp:11,mp:2,atk:3,def:2,mag:2,spd:.7},
            sora:{hp:8,mp:4,atk:2,def:1.5,mag:3.4,spd:.9},
            kagari:{hp:7,mp:5,atk:1.6,def:1.2,mag:3.8,spd:.6}};
function levelUpChar(c,silent){
  c.lv++; const g=GROW[c.id];
  c.mhp+=Math.round(g.hp+c.lv*.9); c.mmp+=Math.round(g.mp+c.lv*.3);
  c.atk+=g.atk; c.def+=g.def; c.mag+=g.mag; c.spd+=g.spd;
  if(!silent){ c.hp=Math.min(c.mhp,c.hp+g.hp*2); c.mp=Math.min(c.mmp,c.mp+g.mp+4); }
}
function gainExp(c,n){
  const learned=[]; let ups=0;
  normalizeCharGrowth(c);
  c.exp+=n;
  while(c.exp>=nextExp(c.lv)){
    const before=charTechs(c); levelUpChar(c,false); ups++;
    charTechs(c).forEach(k=>{if(!before.includes(k))learned.push(TECHS[k].n);});
  }
  return {ups,learned};
}

function useItem(key,target){
  const it=ITEMS[key];
  if(it.t==='all'){ G.party.forEach(c=>{if(c.alive)c.hp=Math.min(c.mhp,c.hp+it.v);});
    G.bag[key]--; SE.heal(); menu&&(menu.note='全員のHPが回復した。'); return; }
  if(it.k==='rev'){ if(target.alive){SE.no();menu&&(menu.note='まだ倒れていない。');return;}
    target.alive=true; target.hp=Math.round(target.mhp*it.v); G.bag[key]--; SE.heal();
    menu&&(menu.note=target.n+'が起き上がった。'); return; }
  if(!target.alive){SE.no();menu&&(menu.note='届かない。');return;}
  if(it.k==='hp'){ if(target.hp>=target.mhp){SE.no();menu&&(menu.note='HPは満ちている。');return;}
    target.hp=Math.min(target.mhp,target.hp+it.v); }
  else { if(target.mp>=target.mmp){SE.no();menu&&(menu.note='MPは満ちている。');return;}
    target.mp=Math.min(target.mmp,target.mp+it.v); }
  G.bag[key]--; SE.heal(); menu&&(menu.note=target.n+'　'+it.n+'をつかった。');
}

function dmgPhys(a,d){return Math.max(1,Math.round((ATK(a)*2.2-DEF(d)*1.1)*(.92+Math.random()*.2)));}
function dmgTech(a,p,d){return Math.max(1,Math.round((MAG(a)*1.6+p*1.5-DEF(d)*.7)*(.94+Math.random()*.14)));}
function dmgFoe(f,c,mul){return Math.max(1,Math.round((ATK(f)*2.0-DEF(c)*1.4)*(.9+Math.random()*.22)*(mul||1)));}

function hitFoe(f,d,o){
  o=o||{};
  if(o.mul>1){d=Math.round(d*o.mul);} else if(o.mul&&o.mul<1){d=Math.round(d*o.mul);}
  if(o.crit)d=Math.round(d*1.8);
  d=Math.max(1,d);
  f.hp-=d; f.hurt=o.crit?.6:.35; B.hitstop=Math.max(B.hitstop,o.crit?.12:.055); B.cam=Math.max(B.cam,o.crit?.7:.38);
  pop(f.x,f.y-18,d,o.crit?'#fff2b8':(o.mul>1?'#ffbde4':'#ffd9a0'),o.crit?16:12);
  if(o.mul>1){pop(f.x+20,f.y-34,'弱点！','#ff9ad8',9);SE.weak();learnFoe(f);}
  else if(o.mul&&o.mul<1){pop(f.x+20,f.y-34,'耐性','#93a6c4',9);learnFoe(f);}
  if(o.crit){pop(f.x-22,f.y-36,'会心！','#ffe89a',10);SE.crit();B.shake=Math.max(B.shake,.4);}
  if(f.hp<=0){
    f.hp=0;f.alive=false;f.deathT=0;
    burst(f.x,f.y-8,f.col||C.time);
    B.shake=Math.max(B.shake,.34);
  }
}
function hitChar(c,d,o){
  o=o||{};
  if(o.crit){d=Math.round(d*1.6);}
  c.hp-=d; B.hitstop=Math.max(B.hitstop,o.crit?.13:.06); B.cam=Math.max(B.cam,o.crit?.72:.42); B.poses[c.id]={kind:'hurt',t:.34}; pop(PX(G.party.indexOf(c)),118,d,o.crit?'#ffd0d0':'#ff9a9a',o.crit?15:12);
  if(o.crit){pop(PX(G.party.indexOf(c))+18,104,'痛恨！','#ff7f7f',9);SE.crit();}
  B.shake=Math.max(B.shake,o.crit?.45:Math.min(.3,d/(c.mhp*1.6)));
  if(c.hp<=0){c.hp=0;c.alive=false;c.atb=0;SE.down();} }

/* --- 行動の実行 --- */
function execAction(act){
  B.anim={t:0,dur:act.dur||.72,kind:act.kind,act};
  if(B.actor){
    const poseKind=act.kind==='slash'?'attack':(act.kind==='heal'||act.kind==='tech'||act.kind==='dual'?'cast':'idle');
    B.poses[B.actor.id]={kind:poseKind,t:act.dur||.72};
  }
  if(B.actor){
    const i=G.party.indexOf(B.actor); ring(PX(B.actor?i:0),134,act.kind==='heal'?C.hp:(act.kind==='dual'?C.time:C.hi));
    if(act.kind==='tech'||act.kind==='heal'||act.kind==='dual'){
      B.cutin={
        id:B.actor.id,
        label:(act.log||'').replace(B.actor.n,'').replace(/[！!]+$/,'').trim()||'SPECIAL',
        kind:act.kind,
        t:0,
        dur:act.kind==='dual'?1.15:.82
      };
    }
  }
  B.mode='exec'; B.log=act.log; B.logT=1.6;
  act.apply();
}
function partyAttack(c,target){
  execAction({kind:'slash',log:c.n+'の こうげき！',apply:()=>{
    SE.hit(); if(target.alive)hitFoe(target,dmgPhys(c,target),{crit:critRoll(c)}); }});
}
function partyTech(c,key,target){
  const t=TECHS[key]; c.mp-=t.mp;
  execAction({kind:t.el==='回復'?'heal':'tech',dur:.9,log:c.n+'　'+t.n+'！',apply:()=>{
    if(t.el==='回復'){ SE.heal();
      if(t.t==='allyall')aliveParty().forEach(m=>{const v=Math.round(t.p*(1+MAG(c)/60));
        m.hp=Math.min(m.mhp,m.hp+v);pop(PX(G.party.indexOf(m)),112,v,'#9fe8a8');});
      else{const v=Math.round(t.p*(1+MAG(c)/60));target.hp=Math.min(target.mhp,target.hp+v);
        pop(PX(G.party.indexOf(target)),112,v,'#9fe8a8');}
    }else{ SE.tech(); B.flash=.25;
      const els=techEls(t);
      const strike=f=>hitFoe(f,dmgTech(c,t.p,f),{crit:critRoll(c),mul:elemMul(els,f)});
      if(t.t==='all')aliveFoes().forEach(strike);
      else if(target&&target.alive)strike(target); }
  }});
}
function partyDual(d,members,target){
  members.forEach(m=>{m.mp-=d.mp;m.atb=0;});
  const mag=members.reduce((s,m)=>s+MAG(m),0)/members.length;
  const fake={mag,spd:members.reduce((s,m)=>s+SPD(m),0)/members.length};
  execAction({kind:'dual',dur:1.25,log:'連携技　'+d.n+'！！',apply:()=>{
    SE.tech(); setTimeout(()=>SE.tech(),140); B.flash=.55;
    const strike=f=>hitFoe(f,dmgTech(fake,d.p,f),{crit:critRoll(fake),mul:elemMul(d.els,f)});
    if(d.t==='all')aliveFoes().forEach(strike);
    else if(target&&target.alive)strike(target);
  }});
}
function foeAction(f){
  const targets=aliveParty(); if(!targets.length)return;
  const t=targets[Math.floor(Math.random()*targets.length)];
  f.act=1;
  if(f.key==='galeon'&&Math.random()<.34){
    execAction({kind:'foeall',dur:.85,log:f.n+'の 圧壊砲！',apply:()=>{SE.hit();B.flash=.3;
      aliveParty().forEach(c=>hitChar(c,dmgFoe(f,c,.85)));}});return;
  }
  if(f.key==='enbi'){
    const r=Math.random();
    if(f.charge>0){ f.charge=0;
      execAction({kind:'foeall',dur:1,log:f.n+'の 業火の息！',apply:()=>{SE.hit();B.flash=.6;
        aliveParty().forEach(c=>hitChar(c,dmgFoe(f,c,1.15)));}});return;}
    if(r<.28){ f.charge=1;
      execAction({kind:'wait',dur:.7,log:f.n+'は 息を吸い込んでいる…',apply:()=>{}});return;}
  }
  if(f.key==='tokihami'){
    const r=Math.random();
    if(r<.3){ execAction({kind:'foeall',dur:1,log:f.n+'の 刻喰み！',apply:()=>{SE.hit();B.flash=.5;
      aliveParty().forEach(c=>hitChar(c,dmgFoe(f,c,f.ph===2?1.0:.8)));}});return;}
    if(r<.45){ execAction({kind:'wait',dur:.8,log:f.n+'は '+t.n+'の刻を止めた！',apply:()=>{
      t.atb=0; pop(PX(G.party.indexOf(t)),112,'刻停止',C.time,10);}});return;}
  }
  execAction({kind:'foe',log:f.n+'の こうげき！',apply:()=>{SE.hit();hitChar(t,dmgFoe(f,t),{crit:Math.random()<.07});}});
}

/* --- 連携技の候補 --- */
function readyDuals(actor){
  const ready=aliveParty().filter(c=>c.atb>=1);
  return DUALS.filter(d=>d.mem.includes(actor.id)
    && d.mem.every(id=>{const c=ready.find(x=>x.id===id);return c&&c.mp>=d.mp;})
    && d.mem.every(id=>G.party.some(c=>c.id===id)));
}

function updateBattle(dt){
  if(B.hitstop>0){B.hitstop=Math.max(0,B.hitstop-dt);return;}
  B.intro=Math.max(0,B.intro-dt*2.4);
  B.cam=Math.max(0,B.cam-dt*2.8);
  Object.keys(B.poses||{}).forEach(k=>{
    B.poses[k].t-=dt;
    if(B.poses[k].t<=0)delete B.poses[k];
  });
  B.pops.forEach(p=>p.t+=dt); B.pops=B.pops.filter(p=>p.t<1);
  B.rings.forEach(p=>p.t+=dt); B.rings=B.rings.filter(p=>p.t<.7);
  B.burst.forEach(p=>p.t+=dt); B.burst=B.burst.filter(p=>p.t<1);
  B.foes.forEach(f=>{
    f.hurt=Math.max(0,f.hurt-dt*3);
    f.act=Math.max(0,(f.act||0)-dt*2.4);
    if(!f.alive&&f.deathT!==undefined)f.deathT=Math.min(1.2,f.deathT+dt*1.45);
  });
  if(B.cutin){
    B.cutin.t+=dt;
    if(B.cutin.t>=B.cutin.dur)B.cutin=null;
  }
  B.shake=Math.max(0,B.shake-dt*2.2);
  B.flash=Math.max(0,B.flash-dt*2.2); B.logT=Math.max(0,B.logT-dt);
  if(B.victoryT>0)B.victoryT+=dt;

  if(B.mode==='exec'){
    B.anim.t+=dt;
    if(B.anim.t>=B.anim.dur){
      B.anim=null;
      if(!aliveFoes().length){ finishBattle(true); return; }
      if(!aliveParty().length){ finishBattle(false); return; }
      const tk=B.foes.find(f=>f.key==='tokihami'&&f.alive);
      if(tk&&tk.ph===1&&tk.hp<tk.mhp*.5){
        tk.ph=2; tk.atk=Math.round(tk.atk*1.27); tk.spd+=3; B.flash=1;
        execAction({kind:'wait',dur:1.4,log:'刻喰　「マダ、足リナイ……」',apply:()=>{SE.down();}});
        return;
      }
      B.mode='wait';
    }
    return;
  }
  if(B.mode==='result'){
    if(pressA||pressB){
      B.result.i++;
      if(B.result.i>=B.result.lines.length){
        const won=B.result.won, ref=B.boss;
        B=null; scene='field'; setBgm(mapBgm()); fade=1; fadeDir=-1;
        if(!won){ scene='title'; title={sel:0}; setBgm('none'); return; }
        if(ref){ G.flags[ref.flag]=1; if(ref.win)ref.win(G);
          if(ref.post)say(ref.post); else if(ref.flag==='cleared')startEnding(); }
      }else SE.cur();
    }
    return;
  }

  /* --- ATB --- */
  if(B.mode==='wait'){
    if(!aliveParty().length){ finishBattle(false); return; }
    if(!aliveFoes().length){ finishBattle(true); return; }
    const sp=dt;
    G.party.forEach(c=>{ if(c.alive&&c.atb<1)c.atb=Math.min(1,c.atb+sp*(.13+SPD(c)*.011)); });
    B.foes.forEach(f=>{ if(f.alive&&f.atb<1)f.atb=Math.min(1,f.atb+sp*(.13+SPD(f)*.010)*(f.boss?1.5:1)); });
    const f=B.foes.find(x=>x.alive&&x.atb>=1);
    if(f){ f.atb=0; foeAction(f); return; }
    const c=aliveParty().find(x=>x.atb>=1);
    if(c){ B.mode='cmd'; B.actor=c; B.cmd=0; B.sub=null; B.tsel=0; }
    return;
  }

  /* --- コマンド --- */
  const A=B.actor;
  if(!A.alive){B.mode='wait';return;}

  if(B.sub==='target'){
    const fs=aliveFoes();
    const d=navX('left','right',dt); if(d){B.tsel=(B.tsel+d+fs.length)%fs.length;SE.cur();}
    if(pressB){B.sub=B.back||null;SE.no();return;}
    if(pressA){ const tgt=fs[B.tsel]; A.atb=0;
      if(B.pending.kind==='atk')partyAttack(A,tgt);
      else if(B.pending.kind==='tech')partyTech(A,B.pending.key,tgt);
      else if(B.pending.kind==='dual'){A.atb=1;partyDual(B.pending.d,B.pending.mem,tgt);}
      B.sub=null; }
    return;
  }
  if(B.sub==='ally'){
    const d=navY('up','down',dt); if(d){B.tsel=(B.tsel+d+G.party.length)%G.party.length;SE.cur();}
    if(pressB){B.sub=B.back||null;B.ssel=0;SE.no();return;}
    if(pressA){ const tgt=G.party[B.tsel]; A.atb=0;
      if(B.pending.kind==='item'){ useItem(B.pending.key,tgt);
        execAction({kind:'item',dur:.5,log:A.n+'は '+ITEMS[B.pending.key].n+'をつかった',apply:()=>{}}); }
      else partyTech(A,B.pending.key,tgt);
      B.sub=null; }
    return;
  }
  if(B.sub==='tech'){
    const list=B.techList||[];
    if(!list.length){B.sub=null;return;}
    if(B.ssel>=list.length)B.ssel=list.length-1;
    const d=navY('up','down',dt); if(d){B.ssel=(B.ssel+d+list.length)%list.length;SE.cur();}
    if(pressB){B.sub=null;SE.no();return;}
    if(pressA){
      const e=list[B.ssel];
      if(e.dual){
        if(!e.ok){SE.no();return;}
        B.pending={kind:'dual',d:e.d,mem:e.mem};
        if(e.d.t==='all'){A.atb=1;partyDual(e.d,e.mem,null);B.sub=null;}
        else{B.sub='target';B.back='tech';B.tsel=0;SE.ok();}
      }else{
        const t=TECHS[e.key];
        if(A.mp<t.mp){SE.no();return;}
        SE.ok(); B.pending={kind:'tech',key:e.key};
        if(t.t==='ally'){B.sub='ally';B.back='tech';B.tsel=0;}
        else if(t.t==='allyall'){A.atb=0;partyTech(A,e.key,null);B.sub=null;}
        else if(t.t==='all'){A.atb=0;partyTech(A,e.key,null);B.sub=null;}
        else{B.sub='target';B.back='tech';B.tsel=0;}
      }
    }
    return;
  }
  if(B.sub==='item'){
    const keys=bagItems();
    if(B.ssel>=keys.length)B.ssel=Math.max(0,keys.length-1);
    const d=navY('up','down',dt); if(d){B.ssel=(B.ssel+d+Math.max(1,keys.length))%Math.max(1,keys.length);SE.cur();}
    if(pressB){B.sub=null;SE.no();return;}
    if(pressA){ if(!keys.length){SE.no();return;}
      const k=keys[B.ssel], it=ITEMS[k];
      SE.ok(); B.pending={kind:'item',key:k};
      if(it.t==='all'){A.atb=0;useItem(k,null);
        execAction({kind:'item',dur:.5,log:A.n+'は '+it.n+'をつかった',apply:()=>{}});B.sub=null;}
      else{B.sub='ally';B.back='item';B.tsel=0;}
    }
    return;
  }
  // ルートコマンド
  const CMDS=['たたかう','技','どうぐ','にげる'];
  const d=navY('up','down',dt); if(d){B.cmd=(B.cmd+d+4)%4;SE.cur();}
  if(pressA){
    SE.ok();
    if(B.cmd===0){B.pending={kind:'atk'};B.sub='target';B.back=null;B.tsel=0;}
    else if(B.cmd===1){
      const list=charTechs(A).map(k=>({key:k,n:TECHS[k].n,mp:TECHS[k].mp,desc:TECHS[k].desc}));
      readyDuals(A).forEach(d2=>list.push({dual:1,d:d2,ok:1,n:d2.n,mp:d2.mp,
        desc:d2.desc+'（'+d2.mem.map(id=>G.party.find(c=>c.id===id).n).join('＋')+'）',mem:d2.mem.map(id=>G.party.find(c=>c.id===id))}));
      B.techList=list; B.sub='tech'; B.ssel=0;
    }
    else if(B.cmd===2){B.sub='item';B.ssel=0;}
    else{
      if(B.boss){SE.no();B.log='逃げられない！';B.logT=1.4;return;}
      A.atb=0;
      const avg=aliveParty().reduce((a,c)=>a+SPD(c),0)/Math.max(1,aliveParty().length);
      const fs2=aliveFoes().reduce((a,f)=>a+SPD(f),0)/Math.max(1,aliveFoes().length);
      if(Math.random()<Math.max(.35,Math.min(.9,.5+(avg-fs2)*.03))){ B.escape=1; finishBattle('flee'); }
      else execAction({kind:'wait',dur:.6,log:'……逃げられなかった！',apply:()=>{}});
    }
  }
}

function finishBattle(won){
  if(won==='flee'){
    B.mode='result'; B.result={won:true,i:0,lines:['うまく逃げ切った。']}; return;
  }
  if(!won){ SE.down(); setBgm('none');
    B.mode='result'; B.result={won:false,i:0,
      lines:['——灯が、消えた。','刻は流れつづける。誰にも見とられぬまま。','（タイトルへもどります）']};
    return;
  }
  SE.win(); setBgm('none');
  B.victoryT=1;
  G.party.filter(c=>c.alive).forEach((c,i)=>B.poses[c.id]={kind:'victory',t:99+i*.1});
  const exp=B.foes.reduce((s,f)=>s+f.exp,0);
  const lines=['敵をすべて退けた！', '経験値を '+exp+' 手に入れた。'];
  G.party.forEach((c,i)=>{
    const earned=c.alive?exp:Math.floor(exp/3);
    const r=gainExp(c,earned);
    if(!c.alive&&earned>0)lines.push(c.n+'も 経験値を '+earned+' 得た。');
    if(r.ups){
      lines.push(c.n+'は レベル'+c.lv+'に上がった！');
      burst(150+i*46,126,c.col);
    }
    r.learned.forEach(t=>lines.push(c.n+'は 『'+t+'』を おぼえた！'));
  });
  B.foes.forEach(f=>{ if(f.drop&&Math.random()<f.drop[1]){
    G.bag[f.drop[0]]=(G.bag[f.drop[0]]||0)+1; lines.push(ITEMS[f.drop[0]].n+'を 拾った。'); }});
  B.mode='result'; B.result={won:true,i:0,lines};
}

/* --- 敵の絵 --- */
function drawFoe(f){
  if(f.sh==='boss3'&&artReady('wolf')){
    const bob=Math.sin(T*2.2)*2;CX.save();CX.globalAlpha=f.alive?1:.3;CX.drawImage(ART.wolf,f.x-52,f.y-48+bob,104,78);CX.restore();
    if(f.hurt>0){CX.globalAlpha=f.hurt;rect(f.x-52,f.y-48,104,78,'rgba(255,255,255,.42)');CX.globalAlpha=1;}return;
  }
  const x=f.x, y=f.y;
  CX.save(); CX.translate(x,y);
  if(!f.alive){CX.globalAlpha=.0;}
  const w=f.hurt>0?1:0;
  if(w)CX.translate((Math.random()-.5)*5,0);
  if(f.act>0)CX.translate(Math.sin(f.act*Math.PI)*16,0);
  const c=f.col;
  const puff=Math.sin(T*2.2+x)*1.6;
  switch(f.sh){
    case 'bug': rect(-9,-8+puff,18,12,c); rect(-5,-13+puff,10,6,'#3a4a2a');
      rect(-11,-4+puff,4,3,'#2a3a1a'); rect(7,-4+puff,4,3,'#2a3a1a');
      rect(-4,-11+puff,2,2,'#ff5f5f'); rect(2,-11+puff,2,2,'#ff5f5f'); break;
    case 'beast': rect(-12,-6+puff,24,12,c); rect(8,-14+puff,10,10,c);
      rect(16,-12+puff,3,2,'#ffe27f'); rect(-14,-2+puff,4,8,'#2a2018');
      rect(-9,4+puff,4,6,'#2a2018'); rect(5,4+puff,4,6,'#2a2018'); break;
    case 'plant': rect(-3,-2+puff,6,16,'#3a5a2a');
      for(let i=0;i<5;i++){const a=T*.7+i*1.26;
        CX.fillStyle=c;CX.beginPath();CX.arc(Math.cos(a)*11,-8+Math.sin(a)*8+puff,4,0,7);CX.fill();} break;
    case 'robot': rect(-11,-16+puff,22,20,c); rect(-7,-12+puff,14,6,'#101820');
      rect(-5,-10+puff,3,3,'#ff7f4f'); rect(3,-10+puff,3,3,'#ff7f4f');
      rect(-13,-8+puff,3,14,'#4a5464'); rect(11,-8+puff,3,14,'#4a5464');
      rect(-8,4+puff,6,10,'#3a4450'); rect(3,4+puff,6,10,'#3a4450'); break;
    case 'drone': CX.fillStyle=c;CX.beginPath();CX.arc(0,puff,9,0,7);CX.fill();
      rect(-16,-2+puff,12,2,'#4a5464'); rect(5,-2+puff,12,2,'#4a5464');
      CX.fillStyle='#ff5f4f';CX.beginPath();CX.arc(0,puff,3,0,7);CX.fill();
      CX.strokeStyle='rgba(111,214,232,.5)';CX.beginPath();CX.arc(0,puff,13+Math.sin(T*4)*2,0,7);CX.stroke(); break;
    case 'spider': CX.fillStyle=c;CX.beginPath();CX.ellipse(0,puff,12,9,0,0,7);CX.fill();
      for(let i=0;i<6;i++){const a=(i-2.5)*.5, ln=16;
        CX.strokeStyle='#5a4a6a';CX.lineWidth=2;CX.beginPath();CX.moveTo(0,puff);
        CX.lineTo(Math.cos(a+(i%2?.4:-.4))*ln,Math.abs(Math.sin(a))*ln*.6+puff);CX.stroke();}
      rect(-6,-4+puff,3,3,'#ffd24f'); rect(3,-4+puff,3,3,'#ffd24f'); break;
    case 'boss1': rect(-26,-30+puff,52,34,c); rect(-18,-24+puff,36,12,'#0d141c');
      rect(-13,-21+puff,7,6,'#ff7f4f'); rect(6,-21+puff,7,6,'#ff7f4f');
      rect(-34,-18+puff,8,30,'#4a5464'); rect(26,-18+puff,8,30,'#4a5464');
      rect(-20,4+puff,14,20,'#3a4450'); rect(6,4+puff,14,20,'#3a4450');
      rect(-26,-34+puff,52,4,'#6fd6e8'); break;
    case 'boss2': CX.fillStyle=c;CX.beginPath();CX.ellipse(0,puff,30,20,0,0,7);CX.fill();
      CX.fillStyle='#ffb04f';CX.beginPath();CX.ellipse(0,4+puff,20,12,0,0,7);CX.fill();
      rect(18,-22+puff,18,18,c); rect(30,-16+puff,5,4,'#fff2b0');
      for(let i=0;i<7;i++){const a=T*1.5+i;
        CX.fillStyle='rgba(255,'+(120+Math.sin(a)*80|0)+',60,.7)';
        CX.beginPath();CX.arc(-26+Math.sin(a)*6,-16-i*3+puff,4-i*.3,0,7);CX.fill();}
      rect(-34,4+puff,12,14,'#7a2a18'); rect(14,4+puff,12,14,'#7a2a18'); break;
    case 'boss3': {
      for(let i=0;i<4;i++){const rr=26+i*7+Math.sin(T*1.4+i)*4;
        CX.strokeStyle='rgba(155,111,214,'+(.42-i*.08)+')';CX.lineWidth=2;
        CX.beginPath();CX.arc(0,puff,rr,T*(i%2?1:-1)*.6,T*(i%2?1:-1)*.6+4.4);CX.stroke();}
      CX.fillStyle='#150a26';CX.beginPath();CX.arc(0,puff,22,0,7);CX.fill();
      CX.fillStyle=c;CX.beginPath();CX.arc(0,puff,15,0,7);CX.fill();
      CX.fillStyle='#f0e6ff';CX.beginPath();CX.arc(0,puff,4+Math.sin(T*5)*1.5,0,7);CX.fill();
      rect(-9,-6+puff,5,3,'#0a0612'); rect(4,-6+puff,5,3,'#0a0612'); break;}
  }
  CX.restore();
  if(f.hurt>0){CX.globalAlpha=f.hurt;rect(x-30,y-34,60,50,'rgba(255,255,255,.5)');CX.globalAlpha=1;}
}


/* ---------- Asset-backed battle actor renderer ----------
   Canvas remains the compositor. Character artwork is supplied by ART,
   while movement, pose, camera and effects are controlled independently. */
const BATTLE_ACTOR_STYLE={
  ren:{scale:1.00,accent:'#6fa8ff'},
  sora:{scale:.96,accent:'#78e6ff'},
  kagari:{scale:.98,accent:'#ff9c57'}
};
function battlePose(c){
  if(!c.alive)return 'down';
  const p=B&&B.poses&&B.poses[c.id];
  if(p)return p.kind;
  if(B&&B.mode==='cmd'&&B.actor===c)return 'ready';
  return 'idle';
}
function drawBattleActor(c,i){
  const style=BATTLE_ACTOR_STYLE[c.id]||BATTLE_ACTOR_STYLE.ren;
  const pose=battlePose(c);
  const baseX=160+i*47, baseY=132;
  const bob=pose==='idle'||pose==='ready'?Math.sin(T*3.2+i)*1.3:0;
  let dx=0,dy=bob,rot=0,alpha=1,scale=style.scale;
  if(pose==='attack'&&B.anim){
    const q=Math.min(1,B.anim.t/B.anim.dur);
    dx=-Math.sin(q*Math.PI)*31;
    dy-=Math.sin(q*Math.PI)*5;
    rot=-.08*Math.sin(q*Math.PI);
  }else if(pose==='cast'){
    dy-=3+Math.sin(T*8+i)*2;
    scale*=1.03;
  }else if(pose==='hurt'){
    dx=(Math.sin(T*42+i)*3);
    rot=.08*Math.sin(T*35+i);
  }else if(pose==='down'){
    dy=10;rot=-1.08;alpha=.42;
  }else if(pose==='ready'){
    dy-=1;scale*=1.025;
  }else if(pose==='victory'){
    dy-=3+Math.abs(Math.sin(T*3.1+i))*3;
    rot=(c.id==='ren'?-0.06:c.id==='kagari'?0.05:0);
    scale*=1.035;
  }

  CX.save();
  CX.translate(baseX+dx,baseY+dy);
  CX.rotate(rot);
  CX.scale(scale,scale);
  CX.globalAlpha=alpha;

  // Soft contact shadow.
  CX.save();CX.scale(1,.35);CX.fillStyle='rgba(0,0,0,.45)';
  CX.beginPath();CX.ellipse(0,34,18,8,0,0,Math.PI*2);CX.fill();CX.restore();

  // Character aura for active/casting states.
  if(pose==='ready'||pose==='cast'){
    const r=17+Math.sin(T*5+i)*2;
    const grad=CX.createRadialGradient(0,5,2,0,5,r);
    grad.addColorStop(0,style.accent+'88');grad.addColorStop(1,'rgba(0,0,0,0)');
    CX.fillStyle=grad;CX.beginPath();CX.arc(0,5,r,0,Math.PI*2);CX.fill();
  }

  // High-resolution portrait artwork, clipped into a battle sprite silhouette.
  const art=ART[c.id];
  if(art&&art.complete&&art.naturalWidth){
    CX.save();
    CX.beginPath();
    CX.moveTo(-15,-27);CX.quadraticCurveTo(0,-34,15,-27);
    CX.lineTo(17,21);CX.quadraticCurveTo(0,34,-17,21);CX.closePath();CX.clip();
    CX.drawImage(art,-26,-32,52,70);
    const shade=CX.createLinearGradient(0,-30,0,34);
    shade.addColorStop(0,'rgba(255,255,255,.06)');
    shade.addColorStop(.55,'rgba(0,0,0,0)');
    shade.addColorStop(1,'rgba(3,6,14,.58)');
    CX.fillStyle=shade;CX.fillRect(-28,-34,56,72);
    CX.restore();
    CX.strokeStyle=style.accent;CX.globalAlpha*=.48;CX.lineWidth=1;
    CX.beginPath();CX.moveTo(-15,-27);CX.quadraticCurveTo(0,-34,15,-27);
    CX.lineTo(17,21);CX.quadraticCurveTo(0,34,-17,21);CX.closePath();CX.stroke();
    CX.globalAlpha=alpha;
  }else{
    drawPerson(-8,-16,c.col,c.hair,'l',false,c.id);
  }

  // Weapon/magic identity layers.
  if(c.id==='ren'){
    CX.strokeStyle='#e9f1ff';CX.lineWidth=2;CX.beginPath();
    CX.moveTo(-10,14);CX.lineTo(-28,-7);CX.stroke();
    CX.strokeStyle=style.accent;CX.lineWidth=1;CX.beginPath();
    CX.moveTo(-11,13);CX.lineTo(-27,-6);CX.stroke();
  }else if(c.id==='sora'){
    CX.strokeStyle=style.accent;CX.lineWidth=1.2;
    CX.beginPath();CX.arc(-18,3,7+Math.sin(T*5)*1.5,0,Math.PI*2);CX.stroke();
    CX.fillStyle='#dffbff';CX.beginPath();CX.arc(-18,3,2,0,Math.PI*2);CX.fill();
  }else if(c.id==='kagari'){
    for(let n=0;n<3;n++){
      const a=T*2+n*2.1;
      CX.fillStyle='rgba(255,'+(130+n*25)+',70,.72)';
      CX.beginPath();CX.arc(-17+Math.cos(a)*4,6+Math.sin(a)*7,2.3,0,Math.PI*2);CX.fill();
    }
  }

  if(pose==='attack'&&B.anim){
    const q=Math.min(1,B.anim.t/B.anim.dur);
    CX.globalAlpha=Math.sin(q*Math.PI);
    CX.strokeStyle='#ffffff';CX.lineWidth=3;
    CX.beginPath();CX.arc(-18,-1,25,-1.3,.8);CX.stroke();
  }
  if(pose==='victory'){
    CX.globalAlpha=.35+.25*Math.sin(T*4+i);
    CX.strokeStyle=style.accent;CX.lineWidth=1.4;
    CX.beginPath();CX.arc(0,4,21+Math.sin(T*4+i)*2,0,Math.PI*2);CX.stroke();
    CX.globalAlpha=alpha;
  }
  CX.restore();
}



function drawDyingFoe(f){
  const q=Math.min(1,f.deathT||0);
  CX.save();
  CX.translate(f.x,f.y);
  CX.globalAlpha=Math.max(0,1-q);
  CX.globalCompositeOperation='screen';

  const radius=28+(f.boss?20:0);
  for(let i=0;i<34+(f.boss?22:0);i++){
    const a=i*2.399963+q*1.7;
    const rr=(i%9)*2.7+q*(34+(i%5)*7);
    const x=Math.cos(a)*rr;
    const y=Math.sin(a)*rr*.62-q*18;
    const sz=Math.max(1,3-q*1.8+(i%3)*.5);
    CX.fillStyle=i%4===0?'#ffffff':(f.col||C.time);
    CX.fillRect(x,y,sz,sz);
  }

  CX.strokeStyle=f.col||C.time;
  CX.lineWidth=1.5;
  CX.globalAlpha=(1-q)*.7;
  for(let r=0;r<3;r++){
    CX.beginPath();
    CX.arc(0,-5,8+r*10+q*34,0,Math.PI*2);
    CX.stroke();
  }
  CX.restore();
}

function drawBattleCutin(){
  if(!B||!B.cutin)return;
  const c=B.cutin;
  const q=Math.min(1,c.t/c.dur);
  const enter=Math.min(1,q*4.5);
  const leave=Math.min(1,(1-q)*5);
  const vis=Math.min(enter,leave);
  const char=G.party.find(x=>x.id===c.id);
  if(!char)return;

  CX.save();
  CX.globalAlpha=vis;

  // Dark cinematic strip.
  const stripY=42;
  const stripH=c.kind==='dual'?86:72;
  const grad=CX.createLinearGradient(0,stripY,0,stripY+stripH);
  grad.addColorStop(0,'rgba(3,5,14,.04)');
  grad.addColorStop(.18,'rgba(3,5,14,.92)');
  grad.addColorStop(.82,'rgba(3,5,14,.92)');
  grad.addColorStop(1,'rgba(3,5,14,.04)');
  CX.fillStyle=grad;
  CX.fillRect(0,stripY,LW,stripH);

  // Fast light streaks.
  for(let i=0;i<9;i++){
    const y=stripY+8+i*7;
    const x=((T*210+i*43)%430)-80;
    CX.fillStyle=i%2?'rgba(255,255,255,.08)':'rgba(111,214,232,.10)';
    CX.fillRect(x,y,74+i*4,1);
  }

  const slide=(1-enter)*-62+(1-leave)*-22;
  const portraitW=c.kind==='dual'?116:94;
  const portraitH=stripH+20;
  drawPortrait(c.id,8+slide,stripY-10,portraitW,portraitH,false);

  // Character accent and skill title.
  const accent=c.id==='sora'?'#78e6ff':c.id==='kagari'?'#ff9c57':'#6fa8ff';
  const tx=c.kind==='dual'?126:108;
  CX.fillStyle=accent;
  CX.fillRect(tx,stripY+17,3,stripH-30);

  txt(char.n,tx+12,stripY+29,C.dim,9,'left',true);
  const size=c.kind==='dual'?17:15;
  txt(c.label||'SPECIAL',tx+12,stripY+52,C.ink,size,'left',true);

  if(c.kind==='dual'){
    txt('LINK ARTS',tx+12,stripY+70,C.time,8,'left',true);
  }else if(c.kind==='heal'){
    txt('RECOVERY',tx+12,stripY+66,C.hp,8,'left',true);
  }else{
    txt('ABILITY',tx+12,stripY+66,accent,8,'left',true);
  }

  // Expanding line / flare.
  CX.globalAlpha=vis*(.45+.35*Math.sin(q*Math.PI));
  CX.strokeStyle=accent;
  CX.lineWidth=2;
  CX.beginPath();
  CX.moveTo(tx+6,stripY+stripH-10);
  CX.lineTo(tx+8+q*(LW-tx-14),stripY+stripH-10);
  CX.stroke();

  CX.restore();
}

function drawElementalActionEffects(){
  if(!B||!B.anim||!B.actor)return;
  const a=B.anim;
  const actor=B.actor;
  if(a.kind!=='tech'&&a.kind!=='heal'&&a.kind!=='dual')return;

  const q=Math.min(1,a.t/a.dur);
  const sx=160+G.party.indexOf(actor)*47;
  const sy=132;
  const targets=aliveFoes();
  const target=targets[Math.min(B.tsel||0,Math.max(0,targets.length-1))]||B.foes[0];
  if(!target)return;

  CX.save();

  if(actor.id==='sora'&&a.kind!=='heal'){
    // Blue-white magic projectile with a curved trail.
    const p=Math.min(1,Math.max(0,(q-.18)/.62));
    const ex=target.x,ey=target.y-8;
    const cx=(sx+ex)/2,cy=Math.min(sy,ey)-46;
    const x=(1-p)*(1-p)*sx+2*(1-p)*p*cx+p*p*ex;
    const y=(1-p)*(1-p)*sy+2*(1-p)*p*cy+p*p*ey;
    for(let i=0;i<5;i++){
      const pp=Math.max(0,p-i*.045);
      const tx=(1-pp)*(1-pp)*sx+2*(1-pp)*pp*cx+pp*pp*ex;
      const ty=(1-pp)*(1-pp)*sy+2*(1-pp)*pp*cy+pp*pp*ey;
      CX.globalAlpha=.18+i*.11;
      CX.fillStyle=i===4?'#ffffff':'#78e6ff';
      CX.beginPath();CX.arc(tx,ty,2+i*.7,0,Math.PI*2);CX.fill();
    }
    CX.globalAlpha=.34*Math.sin(q*Math.PI);
    CX.strokeStyle='#bff7ff';CX.lineWidth=2;
    CX.beginPath();CX.arc(ex,ey,10+q*28,0,Math.PI*2);CX.stroke();
  }else if(actor.id==='kagari'&&a.kind!=='heal'){
    // Fire pillar beneath the target.
    const ex=target.x,ey=target.y+14;
    const rise=Math.sin(Math.min(1,q*1.25)*Math.PI);
    for(let i=0;i<13;i++){
      const ang=i*1.7+T*3;
      const rr=5+(i%5)*3;
      const px=ex+Math.cos(ang)*rr;
      const py=ey-Math.abs(Math.sin(ang))*rise*(24+(i%4)*7);
      const sz=2+(i%3);
      CX.globalAlpha=.35+.45*rise;
      CX.fillStyle=i%3===0?'#fff1a6':i%3===1?'#ff9c57':'#e74c31';
      CX.beginPath();CX.arc(px,py,sz,0,Math.PI*2);CX.fill();
    }
    CX.globalAlpha=.32*rise;
    const fg=CX.createRadialGradient(ex,ey,2,ex,ey,35);
    fg.addColorStop(0,'rgba(255,236,140,.95)');
    fg.addColorStop(.45,'rgba(255,100,45,.55)');
    fg.addColorStop(1,'rgba(255,50,20,0)');
    CX.fillStyle=fg;CX.fillRect(ex-38,ey-42,76,50);
  }else if(a.kind==='heal'){
    // Healing petals / light motes around the party.
    G.party.filter(x=>x.alive).forEach((m,i)=>{
      const x=160+i*47,y=134;
      for(let n=0;n<7;n++){
        const ang=n*.9+T*1.7+i;
        const rr=8+(n%3)*6+q*8;
        CX.globalAlpha=.28+.35*Math.sin(q*Math.PI);
        CX.fillStyle=n%2?'#bfffc7':'#ffffff';
        CX.beginPath();
        CX.arc(x+Math.cos(ang)*rr,y-6+Math.sin(ang)*rr-q*14,1.5+(n%2),0,Math.PI*2);
        CX.fill();
      }
    });
  }

  CX.restore();
}

function drawCinematicBattleEffects(){
  if(!B||!B.anim)return;
  const a=B.anim, q=Math.min(1,a.t/a.dur);
  const actor=B.actor;
  const foes=aliveFoes();
  const target=foes[Math.min(B.tsel||0,Math.max(0,foes.length-1))]||foes[0];

  CX.save();
  if(a.kind==='slash'&&actor&&target){
    const sx=LW-28, sy=132;
    const ex=target.x, ey=target.y-5;
    const p=Math.sin(q*Math.PI);
    for(let i=0;i<4;i++){
      const lag=Math.max(0,p-i*.12);
      CX.globalAlpha=.26-i*.05;
      CX.strokeStyle=i===0?'#ffffff':i===1?'#9fd8ff':'#517cff';
      CX.lineWidth=4-i*.7;
      CX.beginPath();
      CX.moveTo(sx+(ex-sx)*lag-12,sy+(ey-sy)*lag+12);
      CX.quadraticCurveTo((sx+ex)/2,ey-36-i*4,ex+16,ey-14+i*5);
      CX.stroke();
    }
    if(q>.38&&q<.72){
      CX.globalAlpha=1-Math.abs(q-.55)*5.8;
      CX.fillStyle='rgba(255,255,255,.22)';
      CX.fillRect(0,0,LW,LH);
      CX.translate(ex,ey);
      CX.rotate(-.72);
      const gr=CX.createLinearGradient(-42,0,42,0);
      gr.addColorStop(0,'rgba(255,255,255,0)');
      gr.addColorStop(.5,'rgba(255,255,255,.96)');
      gr.addColorStop(1,'rgba(110,170,255,0)');
      CX.fillStyle=gr;CX.fillRect(-45,-2,90,4);
    }
  }else if((a.kind==='tech'||a.kind==='heal'||a.kind==='dual')&&actor){
    const x=LW-28, y=132;
    const col=actor.id==='sora'?'#78e6ff':actor.id==='kagari'?'#ff9c57':'#d7e5ff';
    CX.globalAlpha=.55*(1-q*.45);
    CX.strokeStyle=col;CX.lineWidth=1.4;
    for(let r=0;r<3;r++){
      CX.beginPath();
      CX.arc(x,y+13,10+r*7+Math.sin(T*6+r)*2,0,Math.PI*2);
      CX.stroke();
    }
    for(let n=0;n<12;n++){
      const ang=n*Math.PI*2/12+T*(actor.id==='kagari'?1.8:.9);
      const rad=13+q*22+(n%3)*3;
      CX.fillStyle=col;
      CX.fillRect(x+Math.cos(ang)*rad,y+8+Math.sin(ang)*rad,2,2);
    }
    if(a.kind==='dual'){
      CX.globalAlpha=.22*Math.sin(q*Math.PI);
      const dg=CX.createRadialGradient(LW/2,LH/2,8,LW/2,LH/2,150);
      dg.addColorStop(0,'rgba(220,190,255,.95)');
      dg.addColorStop(1,'rgba(20,8,45,0)');
      CX.fillStyle=dg;CX.fillRect(0,0,LW,LH);
    }
  }else if((a.kind==='foe'||a.kind==='foeall')&&B.foes.length){
    CX.globalAlpha=.18*Math.sin(q*Math.PI);
    CX.fillStyle='#ff4966';CX.fillRect(0,0,LW,LH);
  }
  CX.restore();
}

function drawTurnOrder(){
  if(!B||B.mode==='result')return;
  const units=[];
  G.party.forEach(c=>{if(c.alive)units.push({n:c.n,v:c.atb||0,col:c.col,id:c.id,ally:1});});
  B.foes.forEach(f=>{if(f.alive)units.push({n:f.n,v:f.atb||0,col:f.col,id:f.key,ally:0});});
  units.sort((a,b)=>b.v-a.v);
  const shown=units.slice(0,6);
  const start=LW-shown.length*20-7;
  shown.forEach((u,i)=>{
    const x=start+i*20,y=31;
    CX.save();CX.translate(x,y);
    CX.fillStyle='rgba(5,8,18,.82)';
    CX.strokeStyle=u.v>=1?C.hi:(u.ally?'#6fa8e8':'#b45a69');
    CX.lineWidth=u.v>=1?1.6:1;
    CX.beginPath();CX.moveTo(0,-8);CX.lineTo(8,0);CX.lineTo(0,8);CX.lineTo(-8,0);CX.closePath();CX.fill();CX.stroke();
    CX.fillStyle=u.col;CX.globalAlpha=.9;
    CX.beginPath();CX.arc(0,0,3.2,0,Math.PI*2);CX.fill();
    CX.restore();
  });
  txt('TURN',start-12,34,C.sub,7,'right',true);
}

function drawBattle(){
  const era=MAPS[G.map].era;
  const battleArtKey=era==='未来'?'battle_future':era==='過去'?'battle_past':era==='?'?'battle_deep':'battle_present';
  const hasBattleArt=drawArt(battleArtKey,0,0,LW,LH,1);
  if(hasBattleArt)rect(0,0,LW,LH,'rgba(2,5,12,.40)');
  const g=CX.createLinearGradient(0,0,0,LH);
  if(era==='未来'){g.addColorStop(0,'#0a1424');g.addColorStop(1,'#04070f');}
  else if(era==='過去'){g.addColorStop(0,'#26140c');g.addColorStop(1,'#0a0604');}
  else if(era==='?'){g.addColorStop(0,'#1a0d30');g.addColorStop(1,'#05030c');}
  else{g.addColorStop(0,'#0f2418');g.addColorStop(1,'#05090a');}
  if(!hasBattleArt){CX.fillStyle=g;CX.fillRect(0,0,LW,LH);}
  for(let i=0;i<26;i++){const x=(i*67+((T*8)|0)%LW)%LW, y=(i*41)%110+10;
    rect(x,y,1,1,'rgba(255,255,255,'+(.06+(i%5)*.03)+')');}
  // perspective floor and distant silhouettes
  rect(0,108,LW,132,'rgba(0,0,0,.16)');
  for(let y=112;y<LH;y+=12){CX.strokeStyle='rgba(130,150,190,'+(0.03+(y-112)/500)+')';CX.beginPath();CX.moveTo(0,y);CX.lineTo(LW,y);CX.stroke();}
  for(let i=-7;i<8;i++){CX.strokeStyle='rgba(130,150,190,.06)';CX.beginPath();CX.moveTo(LW/2,108);CX.lineTo(LW/2+i*42,LH);CX.stroke();}
  drawAmbient(era==='未来'?'rain':'spark');

  CX.save();
  if(B.cam>0){
    const z=1+B.cam*.035;
    CX.translate(LW/2,LH/2);CX.scale(z,z);CX.translate(-LW/2,-LH/2);
  }
  if(B.shake>0)CX.translate((Math.random()-.5)*B.shake*16,(Math.random()-.5)*B.shake*11);
  B.foes.forEach((f,fi)=>{
    const originalX=f.x;
    const visible=B.foes.filter(x=>x.alive||x.deathT!==undefined);
    const vi=Math.max(0,visible.indexOf(f));
    f.x=LW/2+(vi-(visible.length-1)/2)*72;
    if(f.alive){
      drawFoe(f);
      if(f.hurt>0){
        CX.save();CX.globalCompositeOperation='screen';CX.globalAlpha=Math.min(.65,f.hurt);
        const rg=CX.createRadialGradient(f.x,f.y,2,f.x,f.y,42);
        rg.addColorStop(0,'rgba(255,255,255,.92)');
        rg.addColorStop(1,'rgba(255,90,140,0)');
        CX.fillStyle=rg;CX.fillRect(f.x-44,f.y-44,88,88);CX.restore();
      }
    }else if(f.deathT!==undefined&&f.deathT<1){
      drawDyingFoe(f);
    }
    f.x=originalX;
  });

  // 味方キャラクターはステージ上に表示しない（UI内のみ表示）
  drawCinematicBattleEffects();
  drawElementalActionEffects();
  CX.restore();

  // 敵カーソル
  if(B.sub==='target'){
    const fs=aliveFoes(), t=fs[Math.min(B.tsel,fs.length-1)];
    if(t){ txt('▼',t.x-4,t.y-38+Math.sin(T*8)*2,C.hi,12);
      font(9);const w=CX.measureText(t.n).width+10;
      rect(t.x-w/2,t.y-52,w,13,'rgba(9,12,26,.85)');
      txt(t.n,t.x,t.y-42,C.ink,9,'center');
      bar(t.x-24,t.y-36,48,3,t.hp,t.mhp,'#e2603f');
      const lo=G.lore&&G.lore[t.key];
      if(lo&&(lo.weak||lo.res)){
        const info=(lo.weak?'弱点 '+lo.weak:'')+(lo.weak&&lo.res?'　':'')+(lo.res?'耐性 '+lo.res:'');

function artRune(x,y,r,c,a){
  CX.save();CX.translate(x,y);CX.rotate(T*.25);CX.globalAlpha=a;CX.strokeStyle=c;CX.lineWidth=1;
  CX.beginPath();CX.arc(0,0,r,0,Math.PI*2);CX.stroke();CX.beginPath();CX.arc(0,0,r*.68,0,Math.PI*2);CX.stroke();
  for(let i=0;i<8;i++){const q=i*Math.PI/4;CX.beginPath();CX.moveTo(Math.cos(q)*r*.72,Math.sin(q)*r*.72);CX.lineTo(Math.cos(q)*r,Math.sin(q)*r);CX.stroke();}
  CX.restore();
}

// More cinematic character portraits while retaining canvas-only portability.
const _artPortrait=drawPortrait;
drawPortrait=function(id,x,y,w,h,flip){
  _artPortrait(id,x,y,w,h,flip);
  const accent=id==='ren'?'#7da4ff':id==='sora'?'#8eeaf2':'#ffb45c';
  CX.save();CX.beginPath();CX.rect(x,y,w,h);CX.clip();
  // hair highlights and facial reflected light
  CX.globalCompositeOperation='screen';CX.globalAlpha=.22;CX.strokeStyle=accent;CX.lineWidth=Math.max(1,w*.018);
  CX.beginPath();CX.moveTo(x+w*.24,y+h*.17);CX.quadraticCurveTo(x+w*.45,y+h*.02,x+w*.66,y+h*.16);CX.stroke();
  const rg=CX.createRadialGradient(x+w*.78,y+h*.38,1,x+w*.78,y+h*.38,w*.35);rg.addColorStop(0,accent+'55');rg.addColorStop(1,'rgba(0,0,0,0)');CX.fillStyle=rg;CX.fillRect(x,y,w,h);
  CX.globalCompositeOperation='source-over';CX.globalAlpha=1;
  // refined frame and name jewel
  CX.strokeStyle='rgba(255,214,122,.64)';CX.lineWidth=1;CX.strokeRect(x+.5,y+.5,w-1,h-1);
  CX.strokeStyle='rgba(255,255,255,.12)';CX.strokeRect(x+2.5,y+2.5,w-5,h-5);
  CX.fillStyle=accent;CX.beginPath();CX.moveTo(x+w-10,y+4);CX.lineTo(x+w-4,y+10);CX.lineTo(x+w-10,y+16);CX.lineTo(x+w-16,y+10);CX.closePath();CX.fill();
  CX.restore();
};

// Character sprite polish: cape/hair motion and weapon silhouettes.
const _artPerson=drawPerson;
drawPerson=function(x,y,col,hair,dir,walk,id){
  const sway=Math.sin(T*3+x*.07)*.8;
  CX.save();
  if(id==='ren'){CX.fillStyle='#bfc9dd';CX.translate(x+8,y+9);CX.rotate(dir==='l'?-0.55:dir==='r'?.55:.1);CX.fillRect(-1,-1,2,11);CX.fillStyle='#d8bb70';CX.fillRect(-2,7,4,2);CX.restore();CX.save();}
  if(id==='sora'){CX.strokeStyle='rgba(168,237,241,.75)';CX.lineWidth=1;CX.beginPath();CX.arc(x+8,y+8+sway,8,0,Math.PI*1.45);CX.stroke();}
  if(id==='kagari'){CX.fillStyle='rgba(255,121,44,.45)';CX.beginPath();CX.moveTo(x+3,y+8);CX.quadraticCurveTo(x-1+sway,y+14,x+4,y+16);CX.fill();}
  CX.restore();
  _artPerson(x,y,col,hair,dir,walk,id);
};

// Higher-impact enemy presentation: contact shadow, rim light, boss sigils.
const _artFoe=drawFoe;
drawFoe=function(f){
  const big=f.boss?1.28:1;
  CX.save();
  CX.globalAlpha=.48;CX.fillStyle='#000';CX.beginPath();CX.ellipse(f.x,f.y+18,(f.boss?34:18),f.boss?7:4,0,0,Math.PI*2);CX.fill();
  if(f.boss){artRune(f.x,f.y-2,42,f.col,.18+.05*Math.sin(T*2));}
  CX.translate(f.x,f.y);CX.scale(big,big);CX.translate(-f.x,-f.y);
  _artFoe(f);
  CX.restore();
  CX.save();CX.globalCompositeOperation='screen';CX.globalAlpha=f.boss?.28:.12;CX.strokeStyle=f.col;CX.lineWidth=f.boss?3:1.5;CX.beginPath();CX.arc(f.x,f.y-2,f.boss?31:17,0,Math.PI*2);CX.stroke();CX.restore();
};

function artBattleFX(){
  if(!B)return;
  // action-specific cinematic streaks
  if(B.anim){
    const q=Math.min(1,B.anim.t/B.anim.dur), k=B.anim.kind||'';
    CX.save();CX.globalCompositeOperation='screen';
    if(k==='slash'){
      CX.globalAlpha=Math.sin(q*Math.PI)*.9;CX.strokeStyle='#fff2b8';CX.lineWidth=3;CX.beginPath();CX.arc(156,91,72,-.55,.8);CX.stroke();
      CX.strokeStyle='#73c8ff';CX.lineWidth=1;CX.beginPath();CX.arc(156,91,77,-.62,.86);CX.stroke();
    }else if(k==='tech'||k==='heal'){
      const col=k==='heal'?'#8dffc0':'#c79aff';artRune(160,102,22+q*35,col,.55*(1-q));
      for(let i=0;i<12;i++){const a=i*Math.PI/6+T;const r=10+q*42;rect(160+Math.cos(a)*r,102+Math.sin(a)*r,2,2,col);}
    }
    CX.restore();
  }
  // active battler halo
  if(B.actor&&B.mode==='cmd'){
    const i=G.party.indexOf(B.actor);if(i>=0){const x=162+i*48,y=139;CX.save();CX.globalCompositeOperation='screen';const g=CX.createRadialGradient(x,y,2,x,y,28);g.addColorStop(0,'rgba(255,221,125,.30)');g.addColorStop(1,'rgba(255,221,125,0)');CX.fillStyle=g;CX.fillRect(x-30,y-30,60,60);CX.restore();}
  }
  txt(ART_PASS.version,LW-5,104,'rgba(205,214,235,.34)',6,'right');
}

function artFieldFX(){
  if(!G)return;const era=MAPS[G.map].era;
  CX.save();CX.globalCompositeOperation='screen';
  if(era==='過去'){artLightRay(18,-8,70,150,.055);artLightRay(216,-15,82,155,.045);}
  else if(era==='未来'){artLightRay(232,-20,58,145,.032);}
  else if(era==='?'){artRune(LW/2,72,52,'#b685ff',.09);}
  CX.restore();
  txt(ART_PASS.version,LW-5,LH-12,'rgba(205,214,235,.32)',6,'right');
}

const _artDrawBattle=drawBattle;
drawBattle=function(){_artDrawBattle();artBattleFX();};
const _artDrawField=drawField;
drawField=function(){_artDrawField();artFieldFX();};


/* ============================================================
   メインループ
   ============================================================ */
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000); last=now; T+=dt;
  if(G)G.playtime+=dt;
  bgmTick(dt);
  shake=Math.max(0,shake-dt*1.5);
  if(toastT>0)toastT-=dt;

  if(fadeDir===1){ fade+=dt*3.4; if(fade>=1){fade=1;fadeDir=-1;if(fadeCb){const c=fadeCb;fadeCb=null;c();}} }
  else if(fadeDir===-1){ fade-=dt*3.0; if(fade<=0){fade=0;fadeDir=0;} }

  const busy=(fadeDir===1);
  if(!busy){
    if(scene==='title')updateTitle(dt);
    else if(scene==='intro')updateIntro();
    else if(scene==='field')updateField(dt);
    else if(scene==='menu')updateMenu(dt);
    else if(scene==='battle')updateBattle(dt);
    else if(scene==='ending')updateEnding(dt);
  }
  eatInput();

  CX.setTransform(SC,0,0,SC,0,0);
  CX.clearRect(0,0,LW,LH);
  if(scene==='title')drawTitle();
  else if(scene==='intro')drawIntro();
  else if(scene==='menu')drawMenu();
  else if(scene==='battle'&&B)drawBattle();
  else if(scene==='ending')drawEnding();
  else if(G)drawField();

  if(toastT>0&&toastMsg){
    font(11); const w=CX.measureText(toastMsg).width+24;
    CX.globalAlpha=Math.min(1,toastT*1.6);
    rect((LW-w)/2,40,w,20,'rgba(9,12,26,.9)');
    CX.strokeStyle=C.hi;CX.strokeRect((LW-w)/2+.5,40.5,w-1,19);
    txt(toastMsg,LW/2,54,C.hi,11,'center');
    CX.globalAlpha=1;
  }
  if(fade>0){CX.globalAlpha=fade;rect(0,0,LW,LH,'#05060c');CX.globalAlpha=1;}
  requestAnimationFrame(frame);
}
resize();
requestAnimationFrame(frame);
</script>
